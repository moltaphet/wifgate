[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
ffi = false
fs_permissions = [{ access = "read", path = "./out" }]

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 64

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
